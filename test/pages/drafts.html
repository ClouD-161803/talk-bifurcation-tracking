<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drafts deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<div class="reveal">
  <div class="slides">
    <section>
      <h2>A finished slide</h2>
      <p id="finished">Its words.</p>
    </section>
    <section data-draft>
      <h2>A   draft
        slide</h2>
      <p id="drafted">Words to change.</p>
    </section>
    <section data-visibility="hidden" data-draft>
      <h2>A hidden draft</h2>
    </section>
    <section>
      <h2>The last slide</h2>
    </section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
