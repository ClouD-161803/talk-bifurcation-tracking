<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>A backdrop started at a step</title>
    <link rel="stylesheet" href="../../theme/vendor/reveal/reset.css" />
    <link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css" />
    <link rel="stylesheet" href="../../theme/beeson.css" />
    <script>
      window.warnings = [];
      const warn = console.warn.bind(console);
      console.warn = (...args) => {
        window.warnings.push(args.join(' '));
        warn(...args);
      };
    </script>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section>
          <h2>Before</h2>
        </section>
        <section>
          <h2>Tubes started at the second step</h2>
          <div class="backdrop" data-backdrop="tubes" data-duration="30" data-cx="0.42" data-cy="0" data-half="0.6"></div>
          <p class="fragment" data-fragment-index="0">First</p>
          <p class="fragment" data-fragment-index="1" data-backdrop-play>Second</p>
        </section>
        <section>
          <h2>After</h2>
        </section>
      </div>
    </div>
    <script src="../../theme/vendor/reveal/reveal.js"></script>
    <script src="../../theme/beeson.js"></script>
    <script>
      Beeson.start({});
    </script>
  </body>
</html>
