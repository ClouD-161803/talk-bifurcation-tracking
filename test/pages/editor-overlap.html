<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Overlapping elements</title>
  <link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
  <link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
  <link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
  <link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
  <div class="reveal"><div class="slides">
    <section>
      <h2>Three overlapping elements</h2>
      <p>A back paragraph, under the other two elements.</p>
      <p style="translate: 60px -60px">A front paragraph, over the back one.</p>
      <div class="shape rectangle tone-accent" style="width: 200px; height: 200px; translate: 760px 230px"></div>
    </section>
    <section>
      <h2>A table</h2>
      <table>
        <tr><th>Name</th><th>Value</th></tr>
        <tr><td>alpha</td><td>1</td></tr>
      </table>
    </section>
    <section>
      <h2>A list</h2>
      <ul>
        <li>A first item of the list.</li>
        <li>A second item of the list.</li>
      </ul>
    </section>
  </div></div>
  <script src="../../theme/vendor/reveal/reveal.js"></script>
  <script src="../../theme/vendor/reveal/notes.js"></script>
  <script src="../../theme/beeson.js"></script>
  <script>Beeson.start({});</script>
</body>
</html>
