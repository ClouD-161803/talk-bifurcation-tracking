<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Fly deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<!-- a box whose step flies its ring in from a square at the left over 0.5 s, and a later step with
     data-focus that holds every step shown -->
<div class="reveal">
  <div class="slides">
    <section>
      <h2>A fly</h2>
      <p class="fragment" id="before">A step before the fly.</p>
      <div class="source" style="position: absolute; left: 100px; top: 400px; width: 100px; height: 100px; background: var(--accent);"></div>
      <div class="fragment" id="box" data-fly-from=".source" data-fly-to=".ring" data-fly-duration="0.5" style="position: absolute; left: 1200px; top: 400px; width: 200px; height: 100px;">
        <div class="ring" style="position: absolute; left: 20px; top: 30px; width: 50px; height: 40px; background: var(--violet);"></div>
      </div>
      <span class="fragment" data-focus></span>
    </section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
