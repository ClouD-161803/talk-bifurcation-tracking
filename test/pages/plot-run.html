<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Plot run deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<!-- a paused plot whose step plays the tab go once, and shows a region that spreads and a curve
     that is drawn on -->
<div class="reveal">
  <div class="slides">
    <section>
      <h2>A plot played once</h2>
      <div class="plot zone" data-plot="data" data-plot-tabs="still" data-plot-tab="still" data-plot-paused></div>
      <span class="fragment" data-plot-tab="go" data-plot-run data-plot-show="fill line"></span>
      <script type="application/json" id="data">{
        "duration": 1,
        "panels": [
          { "id": "p", "x": { "range": [0, 1] }, "y": { "range": [0, 1] },
            "regions": [{ "id": "fill", "points": [[0, 0], [1, 0], [0, 1]], "spread": 0.4, "from": [0.2, 0.2] }],
            "curves": [{ "id": "line", "points": [[0, 0], [1, 1]], "draw": 0.4, "delay": 0.2 }] }
        ],
        "marks": [{ "id": "dot", "panel": "p", "kind": "points" }],
        "tabs": [
          { "name": "still", "values": [0], "data": {} },
          { "name": "go", "values": [0, 1, 2], "times": [0, 0.3, 0.6], "data": { "dot": [[0, 0], [0.5, 0.5], [1, 1]] } }
        ]
      }</script>
    </section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
