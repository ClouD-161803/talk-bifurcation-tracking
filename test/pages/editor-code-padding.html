<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Code padding deck</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/beeson.css">
<style>.reveal pre.tight { padding: 14px 20px; }</style>
</head>
<body>
<div class="reveal">
  <div class="slides">
    <section>
      <h2>Two code boxes</h2>
      <pre><code class="language-python" data-line-numbers>a = 1
b = 2
c = a + b</code></pre>
      <pre class="tight"><code class="language-python" data-line-numbers>for k in range(12):
    x = k * 2
    y = x + 1
    print(x, y)
    z = x - y
    w = z * z
    print(w)
    a = w + 1
    b = a - 1
    c = a * b
    print(c)
    done = True</code></pre>
    </section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/vendor/reveal/highlight.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
