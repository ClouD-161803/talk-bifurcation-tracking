<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Editor locks deck</title>

<div class="reveal">

    <section>
      <h2>Text elements</h2>
      <p class="said" style="width: 700px">A plain paragraph</p>
      <ul class="listed"><li>An item</li><li>Another item</li></ul>
      <div class="math">\[x = 1\]</div>
      <table class="tabled"><tr><th>A</th><th>B</th></tr><tr><td>1</td><td>2</td></tr></table>
      <pre><code class="language-python">x = 1</code></pre>
    </section>

      <h2>A PDF figure</h2>
      <div class="figure-box pdf">
        <img class="for-dark" src="../../demo/figure-dark.png" data-pdf="figure.pdf" alt="A plot">
        <img class="for-light" src="../../demo/figure-light.png" data-pdf="figure.pdf" alt="A plot">
      </div>
    </section>
    <section>
      <h2>A figure with a caption</h2>

        <img class="for-light" src="../../demo/figure-light.png" alt="A figure">
        <figcaption class="caption">A caption</figcaption>
      </figure>
    </section>
