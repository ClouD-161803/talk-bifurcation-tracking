<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Page numbers</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/vendor/fonts/stix-two-text.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<!-- a title, a slide of three steps, a section, a hidden slide, a closing slide, and two slides of
     the appendix, for the numbers of the pages of the print view -->
<div class="reveal">
  <div class="slides">
    <section class="title"><h1>Title</h1></section>
    <section>
      <h2>Steps</h2>
      <p class="fragment">First step</p>
      <p class="fragment">Second step</p>
    </section>
    <section class="section"><h2>Section</h2></section>
    <section data-visibility="hidden"><h2>Hidden</h2></section>
    <section><h2>Plain</h2></section>
    <section class="closing"><h1>Closing</h1></section>
    <section><h2>Appendix one</h2></section>
    <section><h2>Appendix two</h2></section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
