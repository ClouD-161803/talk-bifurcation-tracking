<!-- the deck of the tests of Align and Distribute of a selection as one ensemble, issue 184: two rounded rectangles side by side, a third shape under them, and a locked shape at the left -->
<div class="reveal">
<div class="slides">

<section>
  <h2>Shapes</h2>
  <div class="shape rounded" style="width: 400px; height: 200px; translate: 400px 300px"><p>A</p></div>
  <div class="shape rounded" style="width: 400px; height: 200px; translate: 900px 300px"><p>B</p></div>
  <div class="shape rounded" style="width: 200px; height: 200px; translate: 1500px 700px"><p>C</p></div>
  <div class="shape rounded" style="width: 200px; height: 200px; translate: 100px 700px" data-locked><p>L</p></div>
</section>

</div>
</div>
