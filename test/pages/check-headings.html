<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Deck with headings</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<div class="reveal">
  <div class="slides">
    <section class="title"><div class="title-text"><h1>A title</h1></div></section>
    <section><h2>First</h2></section>
    <section><h2>Second</h2></section>
    <section class="section"><div class="sec"><h2>A section</h2></div></section>
    <section style="padding-top: 150px"><h2>Lower</h2></section>
    <section><h2 style="translate: 6px 0">Right</h2></section>
    <section><h2>Third</h2></section>
    <section style="padding-top: 150px" data-allow="heading"><h2>Lower on purpose</h2></section>
    <section class="wide" style="padding-top: 150px"><h2>Alone in its layout</h2></section>
  </div>
</div>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/vendor/reveal/notes.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
