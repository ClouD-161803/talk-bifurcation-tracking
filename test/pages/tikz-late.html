<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>TikZ deck with a late output</title>
<link rel="stylesheet" href="../../theme/vendor/reveal/reset.css">
<link rel="stylesheet" href="../../theme/vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../theme/beeson.css">
</head>
<body>
<!-- a TikZ figure whose output is loaded 300 ms late, with the mode flipped to light once its load is started -->
<div class="reveal">
  <div class="slides">
    <section>
      <h2>A figure loaded late</h2>
      <div class="figure-box tikz" data-figure="two" style="width: 600px; height: 400px"></div>
    </section>
  </div>
</div>
<script>
const append = HTMLHeadElement.prototype.append;
HTMLHeadElement.prototype.append = function (...nodes) {
  if (!nodes.some((node) => node.src?.includes('figures/'))) return append.apply(this, nodes);
  setTimeout(() => Beeson.theme.set('light'));
  setTimeout(() => append.apply(this, nodes), 300);
};
</script>
<script src="../../theme/vendor/reveal/reveal.js"></script>
<script src="../../theme/beeson.js"></script>
<script>Beeson.start({});</script>
</body>
</html>
