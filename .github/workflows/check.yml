name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: ${{ github.repository == 'beeson-group/slides' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
        shard: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      - run: npm run typecheck
      - name: Run the shard of npm test, written out since npm does not pass options to a script in PowerShell
        run: node --test-force-exit --test-timeout=1200000 --import ./test/helpers/blocking-stdout.mjs scripts/test.mjs --shard=${{ matrix.shard }}/7

  pass:
    needs: [test, check, tex]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail the required check when a job failed or was cancelled, since a skipped check counts as passed
        run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}

  tex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install TeX Live, from the next mirror of Ubuntu when one stalls
        run: |
          cat /etc/apt/apt-mirrors.txt || true
          for attempt in 1 2 3; do
            sudo timeout 240 sh -c 'o="-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=5" && apt-get $o update && apt-get $o install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-pictures lmodern dvisvgm' && break
            test "$attempt" -lt 3
            m=/etc/apt/apt-mirrors.txt
            test -f $m && awk 'NR > 1 { print } NR == 1 { f = $0 } END { print f }' $m | awk -F '\t' '{ print $1 "\tpriority:" NR }' | sudo tee $m.next && sudo mv $m.next $m
          done
      - run: latex --version && dvisvgm --version
      - run: node --test test/figures.test.mjs
      - name: Compile the demo figures again, since the bytes of the output differ between versions of TeX
        run: rm figures/*.js && npm run tex

  check:
    name: check (${{ matrix.os }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","browser":"chrome"},{"os":"ubuntu-latest","browser":"firefox"}]' || '[{"os":"ubuntu-latest","browser":"chrome"},{"os":"ubuntu-latest","browser":"firefox"},{"os":"macos-latest","browser":"chrome"},{"os":"macos-latest","browser":"safari"},{"os":"windows-latest","browser":"chrome","record":true}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.record && 45 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      - run: npm run check
        if: ${{ matrix.browser == 'chrome' }}
      - name: Check the deck in Firefox, in a virtual display, since Firefox on Linux draws WebGL in software only in a window
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run check -- --browser firefox --out check/firefox
        if: ${{ matrix.browser == 'firefox' }}
      - run: sudo safaridriver --enable && npm run check -- --browser safari --out check/safari
        if: ${{ matrix.browser == 'safari' }}
      - run: npm run pdf
        if: ${{ !cancelled() && matrix.browser == 'chrome' }}
      - run: npm run pptx
        if: ${{ !cancelled() && matrix.browser == 'chrome' && matrix.record }}
      - run: npm run pptx -- --still
        if: ${{ !cancelled() && matrix.browser == 'chrome' && !matrix.record }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: slides-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            check/**/*.png
            slides.pdf
            slides.pptx
          if-no-files-found: warn
