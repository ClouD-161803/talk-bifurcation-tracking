name: pr-agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  authorize:
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check that the comment is a command of PR-Agent 0.50.0, from a person with write access
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          authorized=false
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            command="$(python3 - <<'PY'
          import os
          import shlex

          body = os.environ["COMMENT_BODY"].strip()
          lexer = shlex.shlex(body, posix=True)
          lexer.whitespace_split = True
          lexer.quotes = '"'
          lexer.commenters = ''
          try:
              action, *args = list(lexer)
          except ValueError:
              action = ''
          print(action.lstrip('/').lower() if body.startswith('/') else '')
          PY
            )"
            case "$command" in
              auto_review|answer|review|review_pr|describe|describe_pr|improve|improve_code|ask|ask_question|ask_line|update_changelog|config|settings|help|similar_issue|add_docs|generate_labels) ;;
              *) echo "authorized=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          perm="$(gh api "repos/${{ github.repository }}/collaborators/$SENDER/permission" --jq .permission)"
          case "$perm" in write | maintain | admin) authorized=true ;; esac
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"

  pr_agent_job:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: PR Agent action step
        id: pragent
        uses: docker://pragent/pr-agent:0.50.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "openai/glm-5"
          config.fallback_models: '["openai/qwen3"]'
          config.custom_model_max_tokens: "1000000"
          config.max_model_tokens: "64000"
          config.max_output_tokens: "8192"
          LITELLM.EXTRA_BODY: '{"chat_template_kwargs": {"reasoning_effort": "low", "enable_thinking": false}}'
          config.ai_timeout: "600"
          config.retry_same_model_on_timeout: "false"
          OPENAI.API_BASE: "https://ellm.nrp-nautilus.io/v1"
          OPENAI.KEY: ${{ secrets.NRP_API_KEY }}
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
